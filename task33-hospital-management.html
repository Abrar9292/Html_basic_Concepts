<!DOCTYPE html>
<html>
<head>
    <title>Hospital Management</title>
</head>

<body>

<header>
    <h1>City Hospital</h1>
</header>

<h2>Patient Registration</h2>

<form>

    Patient Name:
    <input type="text">

    <br><br>

    Age:
    <input type="number">

    <br><br>

    Appointment Date:
    <input type="date">

</form>

<h2>Doctor Schedule</h2>

<table border="1">

<tr>
    <th>Doctor</th>
    <th>Time</th>
</tr>

<tr>
    <td>Dr. Sharma</td>
    <td>10 AM</td>
</tr>

</table>

<h2>Hospital Location</h2>

<iframe
width="400"
height="300"
src="https://www.google.com/maps/embed?pb=">
</iframe>

<h2>Hospital Video</h2>

<video width="400" controls>
    <source src="sample-video.mp4">
</video>

<footer>
    <p>© 2026 City Hospital</p>
</footer>

</body>
</html>
